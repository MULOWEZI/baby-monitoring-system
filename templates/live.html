<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#f0f6ff"
    >

    <title>Baby Cradle Monitoring System - Live Video</title>

    <!-- =========================================================
         SOCKET.IO
         ========================================================= -->

    <script
        src="https://cdn.socket.io/4.5.4/socket.io.min.js"
        defer
    ></script>

    <!-- =========================================================
         FONT
         ========================================================= -->

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet"
    >

    <style>

        /* =====================================================
           VARIABLES
           ===================================================== */

        :root {

            --bg-primary: #f0f6ff;

            --bg-secondary: #ffffff;

            --card-border: rgba(0, 20, 60, 0.06);

            --text-primary: #0a1a3a;

            --text-secondary: #1a3a6a;

            --text-muted: #5a7a9a;

            --accent: #2563eb;

            --accent-light: #3b82f6;

            --danger: #ef4444;

            --danger-bg: rgba(239, 68, 68, 0.08);

            --warning: #f59e0b;

            --warning-bg: rgba(245, 158, 11, 0.08);

            --success: #22c55e;

            --success-bg: rgba(34, 197, 94, 0.08);

            --sidebar-width: 230px;

            --radius: 16px;

            --radius-small: 10px;

        }


        /* =====================================================
           RESET
           ===================================================== */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        html {
            min-height: 100%;
            background: var(--bg-primary);
        }


        body {

            min-height: 100vh;

            font-family:
                Inter,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;

            background: var(--bg-primary);

            color: var(--text-primary);

            overflow-x: hidden;
        }


        /* =====================================================
           SIDEBAR
           ===================================================== */

        .sidebar {

            position: fixed;

            top: 0;
            left: 0;

            width: var(--sidebar-width);

            height: 100vh;

            background: var(--bg-secondary);

            border-right:
                1px solid var(--card-border);

            padding: 20px 14px;

            display: flex;

            flex-direction: column;

            z-index: 100;

            overflow-y: auto;

            /* Faster than "all" transition */
            transition:
                transform 0.18s ease;
        }


        .sidebar-brand {

            display: flex;

            align-items: center;

            gap: 12px;

            padding-bottom: 18px;

            border-bottom:
                1px solid var(--card-border);

            margin-bottom: 18px;
        }


        .sidebar-brand .logo {

            width: 40px;
            height: 40px;

            border-radius:
                var(--radius-small);

            display: grid;

            place-items: center;

            background:
                linear-gradient(
                    135deg,
                    #2563eb,
                    #3b82f6
                );

            font-size: 1.2rem;

            flex-shrink: 0;
        }


        .brand-text h2 {

            font-size: 0.95rem;

            font-weight: 800;

            line-height: 1.2;
        }


        .brand-text small {

            display: block;

            color: var(--text-muted);

            font-size: 0.55rem;

            margin-top: 2px;
        }


        .sidebar-nav {

            display: flex;

            flex-direction: column;

            gap: 3px;

            flex: 1;
        }


        .sidebar-nav a {

            color: var(--text-secondary);

            text-decoration: none;

            padding: 10px 12px;

            border-radius:
                var(--radius-small);

            font-size: 0.8rem;

            font-weight: 600;

            display: flex;

            align-items: center;

            gap: 10px;

            /*
             * Only transition the properties that need
             * transitioning.
             */
            transition:
                background-color 0.12s ease,
                color 0.12s ease;
        }


        .sidebar-nav a:hover {

            background:
                rgba(37, 99, 235, 0.06);

            color: var(--text-primary);
        }


        .sidebar-nav a.active {

            background:
                linear-gradient(
                    135deg,
                    #2563eb,
                    #3b82f6
                );

            color: #fff;
        }


        .sidebar-nav a i {

            width: 18px;

            font-style: normal;

            text-align: center;
        }


        .sidebar-footer {

            border-top:
                1px solid var(--card-border);

            padding-top: 14px;

            margin-top: auto;
        }


        .status-indicator {

            display: flex;

            align-items: center;

            gap: 8px;

            color: var(--text-muted);

            font-size: 0.65rem;

            font-weight: 600;
        }


        .status-indicator .dot {

            width: 7px;
            height: 7px;

            border-radius: 50%;

            background: var(--success);
        }


        .status-indicator.offline .dot {

            background: var(--danger);
        }


        .version {

            margin-top: 5px;

            color: var(--text-muted);

            font-size: 0.55rem;
        }


        /* =====================================================
           MAIN
           ===================================================== */

        .main-content {

            margin-left: var(--sidebar-width);

            min-height: 100vh;

            padding:
                20px 24px 26px;
        }


        /* =====================================================
           TOP BAR
           ===================================================== */

        .top-bar {

            display: flex;

            align-items: center;

            justify-content: space-between;

            gap: 10px;

            margin-bottom: 20px;
        }


        .page-heading {

            display: flex;

            align-items: center;

            gap: 10px;
        }


        .page-title h1 {

            font-size: 1.2rem;

            font-weight: 800;
        }


        .page-title p {

            font-size: 0.75rem;

            color: var(--text-muted);

            margin-top: 2px;
        }


        /* =====================================================
           LIVE CHIP
           ===================================================== */

        .live-chip {

            display: flex;

            align-items: center;

            gap: 8px;

            color: var(--danger);

            background: var(--danger-bg);

            border:
                1px solid rgba(
                    239,
                    68,
                    68,
                    0.15
                );

            padding:
                6px 14px;

            border-radius: 30px;

            font-size: 0.65rem;

            font-weight: 700;

            text-transform: uppercase;
        }


        .pulse-dot {

            width: 7px;
            height: 7px;

            border-radius: 50%;

            background: var(--danger);

            animation:
                pulse 1.8s infinite;
        }


        @keyframes pulse {

            0% {
                box-shadow:
                    0 0 0 0
                    rgba(
                        239,
                        68,
                        68,
                        0.4
                    );
            }

            70% {
                box-shadow:
                    0 0 0 7px
                    rgba(
                        239,
                        68,
                        68,
                        0
                    );
            }

            100% {
                box-shadow:
                    0 0 0 0
                    rgba(
                        239,
                        68,
                        68,
                        0
                    );
            }
        }


        /* =====================================================
           GRID
           ===================================================== */

        .main-grid {

            display: grid;

            grid-template-columns:
                minmax(0, 2.2fr)
                minmax(280px, 1fr);

            gap: 20px;

            align-items: start;
        }


        /* =====================================================
           VIDEO PANEL
           ===================================================== */

        .video-panel {

            background:
                var(--bg-secondary);

            border:
                1px solid var(--card-border);

            border-radius:
                var(--radius);

            overflow: hidden;

            box-shadow:
                0 4px 20px
                rgba(
                    37,
                    99,
                    235,
                    0.06
                );
        }


        .video-container {

            position: relative;

            width: 100%;

            aspect-ratio: 4 / 3;

            background: #07101e;

            display: flex;

            align-items: center;

            justify-content: center;

            overflow: hidden;
        }


        /*
         * IMPORTANT:
         *
         * Do NOT put transitions on the video image.
         * The image is an MJPEG stream.
         */
        .video-container img {

            width: 100%;

            height: 100%;

            display: block;

            object-fit: contain;

            background: #07101e;
        }


        /* =====================================================
           PLACEHOLDER
           ===================================================== */

        .video-placeholder {

            position: absolute;

            inset: 0;

            display: flex;

            flex-direction: column;

            align-items: center;

            justify-content: center;

            gap: 12px;

            color: #718096;

            background: #07101e;

            z-index: 2;
        }


        .video-placeholder .big {

            font-size: 3rem;

            opacity: 0.35;
        }


        .video-placeholder span {

            font-size: 0.85rem;

            font-weight: 500;
        }


        .spinner {

            width: 28px;

            height: 28px;

            border:
                2px solid
                rgba(
                    255,
                    255,
                    255,
                    0.08
                );

            border-top-color:
                var(--accent);

            border-radius: 50%;

            animation:
                spin 0.8s linear infinite;
        }


        @keyframes spin {

            to {
                transform: rotate(360deg);
            }
        }


        /* =====================================================
           REC CHIP
           ===================================================== */

        .rec-chip {

            position: absolute;

            top: 14px;
            left: 16px;

            z-index: 5;

            display: none;

            align-items: center;

            gap: 8px;

            background:
                rgba(
                    0,
                    0,
                    0,
                    0.62
                );

            color: #f87171;

            font-size: 0.6rem;

            font-weight: 700;

            letter-spacing: 0.8px;

            padding:
                5px 12px;

            border-radius: 30px;
        }


        .rec-dot {

            width: 7px;
            height: 7px;

            border-radius: 50%;

            background:
                #ef4444;

            animation:
                blink 1.2s infinite;
        }


        @keyframes blink {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0.15;
            }
        }


        /* =====================================================
           INFO PANEL
           ===================================================== */

        .info-panel {

            display: flex;

            flex-direction: column;

            gap: 12px;
        }


        .info-card {

            background:
                var(--bg-secondary);

            border:
                1px solid var(--card-border);

            border-radius:
                var(--radius-small);

            padding:
                14px 16px;

            display: flex;

            align-items: center;

            gap: 14px;

            box-shadow:
                0 4px 20px
                rgba(
                    37,
                    99,
                    235,
                    0.04
                );
        }


        .info-icon {

            width: 40px;
            height: 40px;

            border-radius:
                var(--radius-small);

            display: grid;

            place-items: center;

            font-size: 1.1rem;

            background:
                rgba(
                    37,
                    99,
                    235,
                    0.07
                );

            flex-shrink: 0;
        }


        .info-meta {

            flex: 1;

            min-width: 0;
        }


        .info-label {

            font-size: 0.55rem;

            color: var(--text-muted);

            text-transform: uppercase;

            letter-spacing: 1.2px;

            font-weight: 700;
        }


        .info-value {

            font-size: 1.2rem;

            font-weight: 800;

            margin-top: 2px;

            color: var(--text-primary);
        }


        /* =====================================================
           BADGES
           ===================================================== */

        .status-badge {

            display: inline-block;

            padding:
                3px 12px;

            border-radius: 30px;

            font-size: 0.55rem;

            font-weight: 700;

            text-transform: uppercase;

            flex-shrink: 0;
        }


        .status-badge.normal {

            background:
                var(--success-bg);

            color:
                var(--success);
        }


        .status-badge.warning {

            background:
                var(--warning-bg);

            color:
                var(--warning);
        }


        .status-badge.critical {

            background:
                var(--danger-bg);

            color:
                var(--danger);
        }


        /* =====================================================
           FOOTER
           ===================================================== */

        .footer {

            text-align: center;

            color: var(--text-muted);

            font-size: 0.65rem;

            padding:
                16px 0 4px;

            border-top:
                1px solid var(--card-border);

            margin-top: 20px;
        }


        .footer span {

            color: var(--text-secondary);

            font-weight: 500;
        }


        /* =====================================================
           HAMBURGER
           ===================================================== */

        .hamburger {

            display: none;

            background: transparent;

            border: none;

            color: var(--text-primary);

            font-size: 1.3rem;

            cursor: pointer;

            padding: 5px;

            border-radius: 8px;
        }


        .sidebar-overlay {

            display: none;

            position: fixed;

            inset: 0;

            background:
                rgba(
                    0,
                    0,
                    0,
                    0.25
                );

            z-index: 99;
        }


        .sidebar-overlay.active {

            display: block;
        }


        /* =====================================================
           RESPONSIVE
           ===================================================== */

        @media (max-width: 992px) {

            .sidebar {

                transform:
                    translateX(-100%);

                width: 270px;
            }


            .sidebar.open {

                transform:
                    translateX(0);
            }


            .main-content {

                margin-left: 0;

                padding:
                    14px 16px 20px;
            }


            .hamburger {

                display: block;
            }


            .main-grid {

                grid-template-columns: 1fr;
            }


            .video-container {

                aspect-ratio: 16 / 9;

                max-height: 500px;
            }
        }


        @media (max-width: 480px) {

            .page-title h1 {

                font-size: 1rem;
            }


            .page-title p {

                font-size: 0.65rem;
            }


            .info-card {

                padding:
                    12px;
            }


            .info-icon {

                width: 34px;

                height: 34px;

                font-size: 0.9rem;
            }


            .info-value {

                font-size: 1rem;
            }


            .video-container {

                max-height: 280px;
            }
        }


    </style>
</head>


<body>

    <!-- =========================================================
         SIDEBAR
         ========================================================= -->

    <aside
        class="sidebar"
        id="sidebar"
    >

        <div class="sidebar-brand">

            <div class="logo">
                🚼
            </div>

            <div class="brand-text">

                <h2>
                    Baby Cradle
                </h2>

                <small>
                    Smart Monitoring
                </small>

            </div>

        </div>


        <nav class="sidebar-nav">

            <a
                href="/"
                class="link"
            >
                <i>📊</i>
                <span>Dashboard</span>
            </a>


            <a
                href="/live"
                class="link active"
                aria-current="page"
            >
                <i>📷</i>
                <span>Live Video</span>
            </a>


            <a
                href="/history"
                class="link"
            >
                <i>📈</i>
                <span>History</span>
            </a>

        </nav>


        <div class="sidebar-footer">

            <div
                class="status-indicator"
                id="connectionIndicator"
            >

                <span class="dot"></span>

                <span id="conn-status">
                    Connecting...
                </span>

            </div>


            <div class="version">
                v3.0.0
            </div>

        </div>

    </aside>


    <div
        class="sidebar-overlay"
        id="sidebarOverlay"
    ></div>


    <!-- =========================================================
         MAIN
         ========================================================= -->

    <main class="main-content">

        <!-- =====================================================
             TOP BAR
             ===================================================== -->

        <div class="top-bar">

            <div class="page-heading">

                <button
                    class="hamburger"
                    id="hamburgerBtn"
                    aria-label="Toggle sidebar"
                    type="button"
                >
                    ☰
                </button>


                <div class="page-title">

                    <h1>
                        Live Video
                    </h1>

                    <p>
                        Real-time camera feed
                    </p>

                </div>

            </div>


            <div class="live-chip">

                <span class="pulse-dot"></span>

                <span>
                    Live
                </span>

            </div>

        </div>


        <!-- =====================================================
             MAIN GRID
             ===================================================== -->

        <div class="main-grid">

            <!-- =================================================
                 VIDEO
                 ================================================= -->

            <section class="video-panel">

                <div class="video-container">

                    <div
                        class="rec-chip"
                        id="recChip"
                    >

                        <span class="rec-dot"></span>

                        REC

                    </div>


                    <!--
                        IMPORTANT:

                        The source is intentionally NOT
                        cache-busted every few seconds.

                        The backend provides a continuous
                        MJPEG stream.
                    -->

                    <img
                        id="videoFeed"
                        src="/video_feed"
                        alt="Live Cradle Camera"
                        decoding="async"
                        fetchpriority="high"
                        style="display:none;"
                    >


                    <div
                        class="video-placeholder"
                        id="videoPlaceholder"
                    >

                        <div
                            class="spinner"
                            id="videoSpinner"
                        ></div>

                        <div class="big">
                            📷
                        </div>

                        <span>
                            Connecting to camera...
                        </span>

                    </div>

                </div>

            </section>


            <!-- =================================================
                 SENSOR INFO
                 ================================================= -->

            <aside class="info-panel">

                <!-- TEMPERATURE -->

                <div class="info-card">

                    <div class="info-icon">
                        🌡️
                    </div>


                    <div class="info-meta">

                        <div class="info-label">
                            Temperature
                        </div>

                        <div
                            class="info-value"
                            id="temp"
                        >
                            -- °C
                        </div>

                    </div>


                    <div
                        id="temp-badge"
                        class="status-badge normal"
                    >
                        Loading
                    </div>

                </div>


                <!-- HUMIDITY -->

                <div class="info-card">

                    <div class="info-icon">
                        💧
                    </div>


                    <div class="info-meta">

                        <div class="info-label">
                            Humidity
                        </div>

                        <div
                            class="info-value"
                            id="humidity"
                        >
                            -- %
                        </div>

                    </div>


                    <div
                        id="hum-badge"
                        class="status-badge normal"
                    >
                        Loading
                    </div>

                </div>


                <!-- MOTION -->

                <div class="info-card">

                    <div class="info-icon">
                        🏃
                    </div>


                    <div class="info-meta">

                        <div class="info-label">
                            Motion
                        </div>

                        <div
                            class="info-value"
                            id="motion"
                        >
                            --
                        </div>

                    </div>

                </div>


                <!-- SOUND -->

                <div class="info-card">

                    <div class="info-icon">
                        🔊
                    </div>


                    <div class="info-meta">

                        <div class="info-label">
                            Sound
                        </div>

                        <div
                            class="info-value"
                            id="sound"
                        >
                            --
                        </div>

                    </div>

                </div>


                <!-- DIAPER -->

                <div class="info-card">

                    <div class="info-icon">
                        🚼
                    </div>


                    <div class="info-meta">

                        <div class="info-label">
                            Diaper
                        </div>

                        <div
                            class="info-value"
                            id="wetness"
                        >
                            --
                        </div>

                    </div>

                </div>

            </aside>

        </div>


        <!-- =====================================================
             FOOTER
             ===================================================== -->

        <div class="footer">

            <span>
                Baby Cradle Monitoring System
            </span>

            &middot;

            v3.0.0

        </div>

    </main>


    <!-- =========================================================
         JAVASCRIPT
         ========================================================= -->

    <script>

        "use strict";


        /* =====================================================
           ELEMENTS
           ===================================================== */

        const sidebar =
            document.getElementById(
                "sidebar"
            );

        const overlay =
            document.getElementById(
                "sidebarOverlay"
            );

        const hamburger =
            document.getElementById(
                "hamburgerBtn"
            );

        const videoImg =
            document.getElementById(
                "videoFeed"
            );

        const videoPlaceholder =
            document.getElementById(
                "videoPlaceholder"
            );

        const recChip =
            document.getElementById(
                "recChip"
            );

        const connStatus =
            document.getElementById(
                "conn-status"
            );

        const connectionIndicator =
            document.getElementById(
                "connectionIndicator"
            );


        /* =====================================================
           SOCKET
           ===================================================== */

        let socket = null;

        let pageLeaving = false;


        /* =====================================================
           SIDEBAR
           ===================================================== */

        function openSidebar() {

            sidebar.classList.add(
                "open"
            );

            overlay.classList.add(
                "active"
            );

            document.body.style.overflow =
                "hidden";
        }


        function closeSidebar() {

            sidebar.classList.remove(
                "open"
            );

            overlay.classList.remove(
                "active"
            );

            document.body.style.overflow =
                "";
        }


        function toggleSidebar() {

            if (
                sidebar.classList.contains(
                    "open"
                )
            ) {

                closeSidebar();

            } else {

                openSidebar();

            }
        }


        hamburger.addEventListener(
            "click",
            toggleSidebar
        );


        overlay.addEventListener(
            "click",
            closeSidebar
        );


        /* =====================================================
           FAST NAVIGATION
           ===================================================== */

        document
            .querySelectorAll(
                ".sidebar-nav a"
            )
            .forEach(
                (link) => {

                    link.addEventListener(
                        "click",
                        () => {

                            /*
                             * Immediately stop the video
                             * connection before navigating.
                             *
                             * This is important because
                             * /video_feed is a persistent
                             * HTTP connection.
                             */

                            stopVideoStream();

                            disconnectSocket();

                            closeSidebar();

                        },
                        {
                            passive: true
                        }
                    );

                }
            );


        /* =====================================================
           STATUS FUNCTION
           ===================================================== */

        function getStatus(
            value,
            min,
            max
        ) {

            if (
                value === null ||
                value === undefined ||
                Number.isNaN(
                    Number(value)
                )
            ) {

                return "normal";
            }


            const number =
                Number(value);


            if (
                number < min ||
                number > max
            ) {

                return "critical";
            }


            if (
                number < min + 2 ||
                number > max - 2
            ) {

                return "warning";
            }


            return "normal";
        }


        /* =====================================================
           UPDATE SENSOR UI
           ===================================================== */

        function updateSensorUI(
            data
        ) {

            if (!data) {
                return;
            }


            const temperature =
                data.temperature;


            const humidity =
                data.humidity;


            const motion =
                Boolean(
                    data.motion
                );


            const sound =
                Boolean(
                    data.sound
                );


            const wetness =
                Boolean(
                    data.wetness
                );


            /* -----------------------------------------------
               TEMPERATURE
               ----------------------------------------------- */

            document
                .getElementById("temp")
                .textContent =
                    temperature !== null &&
                    temperature !== undefined
                        ? `${temperature} °C`
                        : "-- °C";


            /* -----------------------------------------------
               HUMIDITY
               ----------------------------------------------- */

            document
                .getElementById("humidity")
                .textContent =
                    humidity !== null &&
                    humidity !== undefined
                        ? `${humidity} %`
                        : "-- %";


            /* -----------------------------------------------
               MOTION
               ----------------------------------------------- */

            document
                .getElementById("motion")
                .textContent =
                    motion
                        ? "Moving"
                        : "Quiet";


            /* -----------------------------------------------
               SOUND
               ----------------------------------------------- */

            document
                .getElementById("sound")
                .textContent =
                    sound
                        ? "Loud"
                        : "Quiet";


            /* -----------------------------------------------
               WETNESS
               ----------------------------------------------- */

            document
                .getElementById("wetness")
                .textContent =
                    wetness
                        ? "Wet"
                        : "Dry";


            /* -----------------------------------------------
               TEMPERATURE STATUS
               ----------------------------------------------- */

            updateBadge(
                "temp-badge",
                getStatus(
                    temperature,
                    20,
                    25
                )
            );


            /* -----------------------------------------------
               HUMIDITY STATUS
               ----------------------------------------------- */

            updateBadge(
                "hum-badge",
                getStatus(
                    humidity,
                    40,
                    60
                )
            );

        }


        /* =====================================================
           BADGE
           ===================================================== */

        function updateBadge(
            elementId,
            status
        ) {

            const badge =
                document.getElementById(
                    elementId
                );


            if (!badge) {
                return;
            }


            badge.className =
                "status-badge " +
                status;


            if (
                status === "critical"
            ) {

                badge.textContent =
                    "Critical";

            } else if (
                status === "warning"
            ) {

                badge.textContent =
                    "Warning";

            } else {

                badge.textContent =
                    "Normal";
            }

        }


        /* =====================================================
           SOCKET CONNECTION
           ===================================================== */

        function connectSocket() {

            if (
                pageLeaving ||
                socket
            ) {

                return;
            }


            /*
             * One Socket.IO connection only.
             *
             * websocket first reduces the amount
             * of polling traffic when supported.
             */

            socket = io({

                transports: [
                    "websocket",
                    "polling"
                ],

                upgrade: true,

                reconnection: true,

                reconnectionAttempts: Infinity,

                reconnectionDelay: 1000,

                reconnectionDelayMax: 5000,

                timeout: 10000,

                forceNew: false

            });


            /* -----------------------------------------------
               CONNECT
               ----------------------------------------------- */

            socket.on(
                "connect",
                () => {

                    if (pageLeaving) {
                        return;
                    }


                    connStatus.textContent =
                        "Online";


                    connectionIndicator
                        .classList
                        .remove(
                            "offline"
                        );

                }
            );


            /* -----------------------------------------------
               SENSOR UPDATE
               ----------------------------------------------- */

            socket.on(
                "sensor_update",
                (data) => {

                    if (pageLeaving) {
                        return;
                    }


                    updateSensorUI(
                        data
                    );

                }
            );


            /* -----------------------------------------------
               DISCONNECT
               ----------------------------------------------- */

            socket.on(
                "disconnect",
                () => {

                    if (pageLeaving) {
                        return;
                    }


                    connStatus.textContent =
                        "Offline";


                    connectionIndicator
                        .classList
                        .add(
                            "offline"
                        );

                }
            );


            /* -----------------------------------------------
               ERROR
               ----------------------------------------------- */

            socket.on(
                "connect_error",
                () => {

                    if (pageLeaving) {
                        return;
                    }


                    connStatus.textContent =
                        "Connecting...";

                }
            );

        }


        /* =====================================================
           DISCONNECT SOCKET
           ===================================================== */

        function disconnectSocket() {

            if (!socket) {
                return;
            }


            try {

                socket.removeAllListeners();

                socket.disconnect();

            } catch (error) {

                console.debug(
                    "Socket disconnect:",
                    error
                );

            }


            socket = null;
        }


        /* =====================================================
           VIDEO START
           ===================================================== */

        let videoStarted = false;


        function startVideoStream() {

            if (
                pageLeaving ||
                videoStarted
            ) {

                return;
            }


            videoStarted = true;


            /*
             * Start exactly ONE MJPEG stream.
             *
             * DO NOT use Date.now()
             * DO NOT periodically change src.
             */

            videoImg.src =
                "/video_feed";

        }


        /* =====================================================
           VIDEO STOP
           ===================================================== */

        function stopVideoStream() {

            if (!videoStarted) {
                return;
            }


            try {

                /*
                 * Removing the src closes the HTTP
                 * streaming connection when the page
                 * is being left.
                 */

                videoImg.src = "";

            } catch (error) {

                console.debug(
                    "Video stop:",
                    error
                );

            }


            videoStarted = false;

            videoImg.style.display =
                "none";

            recChip.style.display =
                "none";

            videoPlaceholder.style.display =
                "flex";

        }


        /* =====================================================
           VIDEO LOADED
           ===================================================== */

        videoImg.addEventListener(
            "load",
            () => {

                if (pageLeaving) {
                    return;
                }


                videoImg.style.display =
                    "block";


                videoPlaceholder.style.display =
                    "none";


                recChip.style.display =
                    "flex";

            }
        );


        /* =====================================================
           VIDEO ERROR
           ===================================================== */

        videoImg.addEventListener(
            "error",
            () => {

                if (pageLeaving) {
                    return;
                }


                videoImg.style.display =
                    "none";


                videoPlaceholder.style.display =
                    "flex";


                recChip.style.display =
                    "none";

            }
        );


        /* =====================================================
           INITIAL SENSOR DATA
           ===================================================== */

        async function loadCurrentData() {

            try {

                const response =
                    await fetch(
                        "/api/current_data",
                        {
                            method: "GET",

                            cache: "no-store",

                            headers: {
                                "Accept":
                                    "application/json"
                            }
                        }
                    );


                if (!response.ok) {
                    return;
                }


                const data =
                    await response.json();


                if (!pageLeaving) {

                    updateSensorUI(
                        data
                    );

                }

            } catch (error) {

                /*
                 * Ignore because Socket.IO
                 * remains the live source.
                 */

                console.debug(
                    "Current data fetch:",
                    error
                );

            }

        }


        /* =====================================================
           PAGE VISIBILITY
           ===================================================== */

        document.addEventListener(
            "visibilitychange",
            () => {

                if (
                    document.visibilityState ===
                    "hidden"
                ) {

                    /*
                     * Stop expensive resources when
                     * user switches tabs.
                     */

                    stopVideoStream();

                    disconnectSocket();

                } else {

                    if (!pageLeaving) {

                        connectSocket();

                        startVideoStream();

                        loadCurrentData();

                    }

                }

            }
        );


        /* =====================================================
           PAGE LEAVE
           ===================================================== */

        window.addEventListener(
            "pagehide",
            () => {

                pageLeaving = true;

                stopVideoStream();

                disconnectSocket();

            },
            {
                capture: true
            }
        );


        window.addEventListener(
            "beforeunload",
            () => {

                pageLeaving = true;

                stopVideoStream();

                disconnectSocket();

            },
            {
                capture: true
            }
        );


        /* =====================================================
           ESCAPE CLOSES SIDEBAR
           ===================================================== */

        document.addEventListener(
            "keydown",
            (event) => {

                if (
                    event.key === "Escape"
                ) {

                    closeSidebar();

                }

            }
        );


        /* =====================================================
           START PAGE
           ===================================================== */

        function initializePage() {

            /*
             * Load current sensor values immediately.
             */

            loadCurrentData();


            /*
             * Establish only one Socket.IO
             * connection.
             */

            connectSocket();


            /*
             * Start exactly one video stream.
             */

            startVideoStream();

        }


        /*
         * DOM is already parsed here because this
         * script is at the bottom of <body>.
         */

        initializePage();

    </script>

</body>
</html>
