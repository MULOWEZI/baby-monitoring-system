<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Live Video - Baby Cradle Monitoring System</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#F6F8FC;--surface:#fff;--border:#E6EBF5;--primary:#3457D5;--primary-dark:#24408F;--muted:#7A8498;--text:#131B2E;--danger:#E11D48}
*{box-sizing:border-box;margin:0;padding:0}body{font-family:Inter,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
.header{padding:22px 28px;background:#fff;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;gap:15px}
.brand{font:800 1rem 'Plus Jakarta Sans';}.brand small{display:block;color:var(--muted);font:500 .65rem Inter;margin-top:3px}
.nav{display:flex;gap:8px;flex-wrap:wrap}.nav a{padding:9px 12px;border-radius:10px;text-decoration:none;font-size:.75rem;font-weight:700;color:#4B5875}.nav a.active{background:#3457D5;color:#fff}.logout{color:var(--danger)!important}
main{max-width:1200px;margin:0 auto;padding:28px}.title{margin-bottom:18px}.title h1{font:800 1.45rem 'Plus Jakarta Sans'}.title p{font-size:.78rem;color:var(--muted);margin-top:4px}
.panel{background:#fff;border:1px solid var(--border);border-radius:20px;padding:20px;box-shadow:0 8px 24px rgba(19,27,46,.05)}
.video{background:#0F1523;border-radius:15px;overflow:hidden;aspect-ratio:16/9;display:grid;place-items:center}.video img{width:100%;height:100%;object-fit:contain}.empty{color:#fff8;font-size:.85rem;text-align:center}.empty div{font-size:2rem;margin-bottom:8px}
.status{margin-top:12px;font-size:.72rem;color:var(--muted)}.footer{text-align:center;color:var(--muted);font-size:.65rem;margin-top:18px}
@media(max-width:700px){.header{padding:16px;align-items:flex-start;flex-direction:column}main{padding:16px}}
</style>
</head>
<body>
<header class="header">
  <div class="brand">🚼 Baby Cradle<small>Smart Monitoring</small></div>
  <nav class="nav">
    <a href="/">📊 Dashboard</a><a href="/live" class="active">📷 Live Video</a><a href="/history">📈 History</a>
    <a href="/logout" class="logout">Logout</a>
  </nav>
</header>
<main>
  <div class="title"><h1>Live Camera</h1><p>Authenticated real-time camera feed.</p></div>
  <section class="panel">
    <div class="video">
      <img id="camera" alt="Live camera feed" style="display:none">
      <div class="empty" id="empty"><div>📷</div><span>Waiting for camera feed…</span></div>
    </div>
    <div class="status" id="status">Connecting to camera…</div>
  </section>
  <div class="footer">Signed in as {{ user_email or 'User' }}</div>
</main>
<script>
const img=document.getElementById('camera'), empty=document.getElementById('empty'), status=document.getElementById('status');
fetch('/api/me',{credentials:'same-origin'}).then(r=>{
  if(!r.ok){location.href='/login';return;}
  img.src='/video_feed';
});
img.onload=()=>{img.style.display='block';empty.style.display='none';status.textContent='Live camera feed connected.'};
img.onerror=()=>{img.style.display='none';empty.style.display='grid';status.textContent='Camera feed unavailable.'};
</script>
</body>
</html>
